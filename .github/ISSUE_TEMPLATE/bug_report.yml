name: "Bug Report"
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Python & Environment Version
      description: What Python version and OS are you using?
      placeholder: "e.g., Python 3.11, Ubuntu 24.04 / macOS 14"
    validations:
      required: true
  - type: input
    id: ffmpeg_version
    attributes:
      label: FFmpeg Version
      description: Output of `ffmpeg -version`
      placeholder: "e.g., ffmpeg version 6.1"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `python main.py process /path/to/video.mkv`
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output or stack traces.
      render: shell
